services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campus_lost_found
    ports:
      - "5433:5432"
    volumes:
      - campus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_lost_found"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  campus_pgdata:
