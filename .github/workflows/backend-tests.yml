name: Backend Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campus_lost_found_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campus_lost_found_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus_lost_found_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus_lost_found_test
      SESSION_SECRET: ci-test-secret-only

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check backend TypeScript
        run: npm run typecheck --workspace backend

      - name: Run database migrations
        run: npm run db:migrate --workspace backend

      - name: Run backend tests
        run: npm test --workspace backend

      - name: Build backend
        run: npm run build --workspace backend